name: Build Signed Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_code_offset:
        description: 'Optional versionCode offset (defaults to 0)'
        required: false
        default: '0'

jobs:
  build-android-apk:
    name: Build LAST CHANCE APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 4. Build Vite project
        run: npm run build

      - name: 5. Synchronize Capacitor Android project
        run: npx cap sync android

      - name: 6a. Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 6b. Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: 7. Restore persistent signing keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing persistent signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Repository Secrets."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          if [ ! -s android/app/release-keystore.jks ]; then
            echo "::error::Decoded keystore is empty or invalid."
            exit 1
          fi

      - name: 8. Build signed Android release APK
        working-directory: android
        env:
          LASTCHANCE_STORE_FILE: release-keystore.jks
          LASTCHANCE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LASTCHANCE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LASTCHANCE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          OFFSET="${{ github.event.inputs.version_code_offset || '0' }}"
          VERSION_CODE=$((1 + GITHUB_RUN_NUMBER + OFFSET))
          echo "Building com.lastchance.game with monotonic versionCode=$VERSION_CODE"
          ./gradlew assembleRelease -PVERSION_CODE=$VERSION_CODE --no-daemon

      - name: 9. Verify APK output filename (last-chance.apk)
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          ls -la "$APK_DIR"
          if [ ! -f "$APK_DIR/last-chance.apk" ]; then
            FOUND_APK=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" | head -n 1)
            if [ -z "$FOUND_APK" ]; then
              echo "::error::No release APK found in $APK_DIR"
              exit 1
            fi
            cp "$FOUND_APK" "$APK_DIR/last-chance.apk"
          fi
          test -f "$APK_DIR/last-chance.apk"

      - name: 10. Upload last-chance.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: last-chance-apk
          path: android/app/build/outputs/apk/release/last-chance.apk
          if-no-files-found: error

      - name: Clean up temporary keystore
        if: always()
        run: rm -f android/app/release-keystore.jks
